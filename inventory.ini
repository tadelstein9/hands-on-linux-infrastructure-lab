# The lab's computers, as the command center, optiplex-7080, reaches them.
# Each group names a job, so a playbook can aim at one job or at all of them.

[endpoint]
inspiron ansible_host=192.168.12.14

[servers]
optiplex-9020 ansible_host=192.168.12.15

[inference]
precision ansible_host=192.168.12.17

# The clerks' desktops. In the lab, the Inspiron 5567 plays a clerk's desk.
[clerks]
inspiron

[lab:children]
endpoint
servers
inference

[lab:vars]
ansible_python_interpreter=/usr/bin/python3

# The lab's own cloud, all four computers. precision runs the K3s
# server; inspiron, optiplex-9020 and optiplex-7080 join as agents. optiplex-9020 and optiplex-7080
# are reserved (host_vars): work goes there only when a manifest asks.
# optiplex-7080 is the computer Ansible runs on, so it connects locally, not by SSH.
[k3s_server]
precision

[k3s_agent]
inspiron
optiplex-9020
optiplex-7080 ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[k3s:children]
k3s_server
k3s_agent

# Backups. Each computer backs up to a different one; optiplex-9020 and
# precision hold the repositories (host_vars name each client's backup_repo_host).
[backup_repo]
optiplex-9020
precision

[backup_client]
inspiron
optiplex-9020
optiplex-7080
precision
