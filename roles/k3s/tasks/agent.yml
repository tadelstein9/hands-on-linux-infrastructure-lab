- name: The agent's join token, readable by root only
  ansible.builtin.copy:
    content: "{{ hostvars[groups['k3s_server'][0]]['k3s_agent_join_token'] }}\n"
    dest: /etc/rancher/k3s/token
    mode: "0600"
  no_log: true
  when: not ansible_check_mode

- name: The agent's settings
  ansible.builtin.template:
    src: config-agent.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"

- name: Install the K3s agent
  ansible.builtin.command: /root/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: agent
  args:
    creates: /usr/local/bin/k3s
